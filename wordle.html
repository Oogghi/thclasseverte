<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Classe Verte de TH - Wordle</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text y=%2214%22 font-size=%2216%22>🍃</text></svg>">
<link rel="stylesheet" href="styles/common.css" />
<link rel="stylesheet" href="styles/wordle.css" />
<link rel="stylesheet" href="styles/leaderboard.css" />
</head>
<body>
  <main class="wrap">
    <!-- Titre isolé dans sa propre div centrée -->
    <div class="header-title-container">
      <h1>Wordle</h1>
    </div>

    <div id="grid" class="grid" aria-label="Grille"></div>

    <div class="controls">
      <button id="submit">Valider</button>

      <!-- HUD Neo-Brutalist card placé à côté de Valider -->
      <div id="wordle-hud" class="hud-box">
        <div id="words-counter" class="hud-line-main">Mots : 1/8</div>
        <div id="tries-counter" class="hud-line-sub">Essais : 0</div>
      </div>
    </div>

    <!-- On-screen virtual keyboard -->
    <div id="virtual-keyboard" class="virtual-keyboard"></div>

    <div class="status-row" aria-live="polite">
      <div id="msg" class="msg" aria-live="polite"></div>

      <div id="typing-indicator" aria-live="polite" role="status" class="typing-indicator" aria-hidden="true">
        <span class="dot dot1"></span>
        <span class="dot dot2"></span>
        <span class="dot dot3"></span>
        <span class="typing-text"></span>
      </div>
    </div>

    <!-- Bouton Classement TOUJOURS tout en bas -->
    <div class="bottom-leaderboard-container">
      <button id="btn-show-leaderboard" class="btn-leaderboard-bottom">🏆 Classement</button>
    </div>
  </main>

  <script type="module" src="scripts/sound.js"></script>
  <script type="module" src="scripts/wordle.js"></script>
</body>
</html>
