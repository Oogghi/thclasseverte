<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Classe Verte de TH - Wordle</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text y=%2214%22 font-size=%2216%22>🍃</text></svg>">
<link rel="stylesheet" href="styles/wordle.css" />
</head>
<body>
  <main class="wrap">
    <h1>Wordle</h1>

    <div id="grid" class="grid" aria-label="Grille"></div>

    <div class="controls">
      <button id="submit">Valider</button>
    </div>

    <div class="status-row" aria-live="polite">
      <div id="msg" class="msg" aria-live="polite"></div>

      <div id="typing-indicator" aria-live="polite" role="status" class="typing-indicator" aria-hidden="true">
        <span class="dot dot1"></span>
        <span class="dot dot2"></span>
        <span class="dot dot3"></span>
        <span class="typing-text"></span>
      </div>
    </div>
  </main>

  <div id="game-over-popup" class="hidden">
    <div id="game-over-content">
      <h1 id="FINAL_SCORE_TITLE">Score</h1>
      <div id="FINAL_DETAILS"></div>
      <br>
      <button id="popup-restart">Rejouer</button>
    </div>
  </div>

  <script type="module" src="scripts/wordle.js"></script>
</body>
</html>
