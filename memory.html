<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Classe Verte de TH - Memory</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text y=%2214%22 font-size=%2216%22>🍃</text></svg>">
<link rel="stylesheet" href="styles/memory.css" />
<link rel="stylesheet" href="styles/leaderboard.css" />
</head>
<body>
  <main class="wrap">
    <div style="display:flex; justify-content:space-between; align-items:center; width:100%; max-width:680px; margin-bottom:10px;">
      <h1 style="margin:0;">Memory - Trouve les paires de mots !</h1>
      <button id="btn-show-leaderboard" style="padding:6px 14px; font-weight:700; border:2px solid #1a1a1a; background:#ffe4b3; border-radius:8px; cursor:pointer; box-shadow:2px 2px 0px #1a1a1a;">🏆 Classement</button>
    </div>

    <div id="grid" class="grid" aria-label="Grille Memory"></div>

    <!-- small inline message area (kept for short hints) -->
    <div id="msg" class="msg" aria-live="polite"></div>
  </main>

  <!-- Game over popup -->
  <div id="game-over-popup" class="hidden" role="dialog" aria-modal="true" aria-labelledby="final-score">
    <div id="game-over-content">
      <h1 id="final-score">🎉 Bravo ! Tu as toutes les paires ! 🌟</h1>
      <div id="final-details" style="margin-bottom:20px; font-weight:600; color:var(--muted,#555);"></div>
      <button id="popup-restart" style="padding:10px 24px; border-radius:10px; font-weight:700; cursor:pointer;">Super ! Rejouer 🚀</button>
    </div>
  </div>

  <script type="module" src="scripts/memory.js"></script>
</body>
</html>
