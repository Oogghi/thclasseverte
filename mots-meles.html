<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Classe Verte de TH - Mots mêlés</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text y=%2214%22 font-size=%2216%22>🍃</text></svg>">
<link rel="stylesheet" href="styles/mots-meles.css">
<link rel="stylesheet" href="styles/leaderboard.css">
</head>
<body>
<div class="wrap">
  <div style="display:flex; justify-content:space-between; align-items:center; width:100%; margin-bottom:10px;">
    <h1 class="instructions" style="margin:0;">Retrouve 10 des 16 mots de la semaine !</h1>
    <button id="btn-show-leaderboard" style="padding:6px 14px; font-weight:700; border:2px solid #1a1a1a; background:#ffe4b3; border-radius:8px; cursor:pointer; box-shadow:2px 2px 0px #1a1a1a;">🏆 Classement</button>
  </div>

  <div class="alert">
    <span class="alert-text">Pour que ce ne soit pas trop facile, les mots de la grille n'ont pas d'accents !</span>
  </div>
  <div class="game-area">
    <ul id="wordList" class="wordlist"></ul>
    <div id="grid" class="grid"></div>
  </div>

  <div class="secret" id="secret"></div>

  <div id="game-over-popup" class="hidden" role="dialog" aria-modal="true" aria-labelledby="final-score">
    <div id="game-over-content">
      <h1 id="final-score">🎉 Bravo ! Tu as tout trouvé ! 🌟</h1>
      <div id="final-details" style="margin-bottom:20px; font-weight:600; color:var(--muted,#555);"></div>
      <button id="popup-close">Super ! Rejouer 🚀</button>
    </div>
  </div>

</div>
<script type="module" src="scripts/mots-meles.js"></script>
</body>
</html>
