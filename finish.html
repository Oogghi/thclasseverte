<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Classe Verte de TH - Félicitations ! 🥳</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text y=%2214%22 font-size=%2216%22>🍃</text></svg>">
  <link rel="stylesheet" href="styles/finish.css" />
</head>
<body>
  <!-- Lightweight Confetti Container -->
  <div id="confetti-container" class="confetti-container"></div>

  <!-- Clean Victory Card -->
  <div class="wrap">
    <div class="trophy-container">
      <div class="emoji">🥳</div>
      <div class="sparkle-badge">VICTOIRE !</div>
    </div>

    <h1 class="victory-title">Tu as tout terminé ! Bravo ! 🌟</h1>
    <p class="subtitle">Félicitations Champion(ne) ! Tu as brillamment réussi tous les défis de la Classe Verte !</p>

    <!-- Stats / Badges Grid -->
    <div class="stats-grid">
      <div class="stat-item">
        <span class="stat-icon">🏆</span>
        <div class="stat-label">Statut</div>
        <div class="stat-value">Mission Accomplie</div>
      </div>
      <div class="stat-item">
        <span class="stat-icon">🍃</span>
        <div class="stat-label">Niveau</div>
        <div class="stat-value">Maître des Mots</div>
      </div>
    </div>

    <div class="tip-box">
      <span>💡</span> <span>(Ferme l'onglet avec la petite croix noire)</span>
    </div>
  </div>

  <script src="scripts/finish.js"></script>
</body>
</html>
