<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Classe Verte de TH - Admin</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text y=%2214%22 font-size=%2216%22>🍃</text></svg>">
  <link rel="stylesheet" href="/styles/admin.css">
</head>
<body>
  <main class="wrap">
    <h1>Admin</h1>
    <p class="hint">Chaque ligne = une semaine. Utilise <strong>＋</strong> pour ajouter une semaine, et tu peux utiliser <strong>−</strong> pour supprimer la dernière. Clique sur <strong>Save</strong> pour envoyer les modifications à la base de données.</p>

    <!-- Grid where rows (weeks) will be appended -->
    <section id="grid" class="grid" aria-live="polite"></section>

    <!-- Single add/remove area under the grid -->
    <div class="add-area" role="region" aria-label="Add or remove rows">
      <button id="remove-row-btn" class="remove-btn" aria-label="Remove last row">−</button>
      <button id="add-row-btn" class="add-btn" aria-label="Add row below">＋</button>
    </div>

    <!-- Save action -->
    <div class="actions">
      <button id="save-btn" class="save-btn">💾 Save</button>
    </div>

    <!-- Confirmation modal (hidden by default) -->
    <div id="confirm-modal" class="confirm-modal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
      <div class="confirm-panel">
        <h2 id="confirm-title">Are you sure?</h2>
        <p class="confirm-text">The last row contains words. Deleting it will remove those words.</p>
        <div class="confirm-actions">
          <button id="confirm-yes" class="btn btn-danger">Yes</button>
          <button id="confirm-cancel" class="btn btn-secondary">Cancel</button>
        </div>
      </div>
    </div>

    <!-- Template for a row of 4 boxes. Each box has 4 inputs. -->
    <template id="row-template">
      <div class="row" role="group" aria-label="Four boxes row">
        <!-- Left line indicator -->
        <div class="line-num" aria-hidden="true">1</div>

        <!-- Row content (boxes) -->
        <div class="row-body">
          <div class="boxes">
            <div class="box">
              <div class="num" aria-hidden="true">1</div>
              <div class="box-inputs">
                <input type="text" class="box-input" aria-label="Word 1" placeholder="Mot 1">
                <input type="text" class="box-input" aria-label="Word 2" placeholder="Mot 2">
                <input type="text" class="box-input" aria-label="Word 3" placeholder="Mot 3">
                <input type="text" class="box-input" aria-label="Word 4" placeholder="Mot 4">
              </div>
            </div>

            <div class="box">
              <div class="num" aria-hidden="true">2</div>
              <div class="box-inputs">
                <input type="text" class="box-input" aria-label="Word 1" placeholder="Mot 1">
                <input type="text" class="box-input" aria-label="Word 2" placeholder="Mot 2">
                <input type="text" class="box-input" aria-label="Word 3" placeholder="Mot 3">
                <input type="text" class="box-input" aria-label="Word 4" placeholder="Mot 4">
              </div>
            </div>

            <div class="box">
              <div class="num" aria-hidden="true">3</div>
              <div class="box-inputs">
                <input type="text" class="box-input" aria-label="Word 1" placeholder="Mot 1">
                <input type="text" class="box-input" aria-label="Word 2" placeholder="Mot 2">
                <input type="text" class="box-input" aria-label="Word 3" placeholder="Mot 3">
                <input type="text" class="box-input" aria-label="Word 4" placeholder="Mot 4">
              </div>
            </div>

            <div class="box">
              <div class="num" aria-hidden="true">4</div>
              <div class="box-inputs">
                <input type="text" class="box-input" aria-label="Word 1" placeholder="Mot 1">
                <input type="text" class="box-input" aria-label="Word 2" placeholder="Mot 2">
                <input type="text" class="box-input" aria-label="Word 3" placeholder="Mot 3">
                <input type="text" class="box-input" aria-label="Word 4" placeholder="Mot 4">
              </div>
            </div>
          </div>
        </div>
      </div>
    </template>
  </main>

  <!-- script module (imports supabase client) -->
  <script type="module" src="/scripts/admin.js"></script>
</body>
</html>
