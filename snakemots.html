<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Classe Verte de TH - Snake Mots</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text y=%2214%22 font-size=%2216%22>🍃</text></svg>">
  <link rel="stylesheet" href="styles/common.css">
  <link rel="stylesheet" href="styles/snakemots.css">
  <link rel="stylesheet" href="styles/leaderboard.css">
</head>
<body>
  <!-- Titre seul dans sa div centrée -->
  <div class="header-title-container">
    <h1>Snake Mots</h1>
  </div>

  <!-- Mot cible -->
  <div id="word-display" class="word-target"></div>

  <!-- Top-right HUD -->
  <div id="hud" class="hud-box">
    <div id="words-counter">Mots : 0/0</div>
    <div id="lives-counter" style="margin-top:2px;"></div>
  </div>

  <canvas id="game"></canvas>

  <!-- Countdown overlay -->
  <div id="countdown-overlay" class="hidden">
    <div id="countdown-box">
      <div id="countdown-text"></div>
      <div id="countdown-number"></div>
    </div>
  </div>

  <!-- Difficulty selection & Leaderboard Side-by-Side Menu -->
  <div id="difficulty-menu-overlay" class="difficulty-overlay hidden">
    <div class="difficulty-card side-by-side-card" role="dialog" aria-modal="true">
      
      <!-- Left Column: Difficulty Selector -->
      <div class="menu-col menu-col-difficulty">
        <div class="difficulty-header">
          <h2>🐍 Snake Mots</h2>
          <p class="difficulty-subtitle">Choisis ta difficulté pour commencer :</p>
        </div>

        <div class="difficulty-options">
          <button type="button" class="btn-diff btn-diff-easy" data-diff="0">
            <span class="diff-emoji">🟢</span>
            <div class="diff-info">
              <div class="diff-title">Facile</div>
              <div class="diff-desc">Mot toujours visible à l'écran</div>
            </div>
          </button>

          <button type="button" class="btn-diff btn-diff-medium" data-diff="1">
            <span class="diff-emoji">🟠</span>
            <div class="diff-info">
              <div class="diff-title">Moyen</div>
              <div class="diff-desc">Aperçu 5s puis mot masqué</div>
            </div>
          </button>

          <button type="button" class="btn-diff btn-diff-hard" data-diff="2">
            <span class="diff-emoji">🔴</span>
            <div class="diff-info">
              <div class="diff-title">Difficile</div>
              <div class="diff-desc">Mot mystère complet</div>
            </div>
          </button>
        </div>
      </div>

      <!-- Right Column: Leaderboard Side Preview -->
      <div class="menu-col menu-col-leaderboard">
        <div class="leaderboard-side-header">
          <h3>🏆 Classement</h3>
          <p class="leaderboard-side-subtitle">Top Joueurs (Semaine)</p>
        </div>

        <div class="leaderboard-side-body">
          <table class="scores-table-side">
            <thead>
              <tr>
                <th style="width:46px;">Rang</th>
                <th>Joueur</th>
                <th style="text-align:right;">Score</th>
              </tr>
            </thead>
            <tbody id="side-scores-body">
              <!-- Dynamically filled -->
            </tbody>
          </table>
        </div>

        <button type="button" id="btn-open-full-leaderboard" class="btn-side-full-lb">🏆 Voir tout le classement</button>
      </div>

    </div>
  </div>

  <!-- Bouton Classement & Difficulté Tout en bas -->
  <div class="bottom-leaderboard-container">
    <button id="btn-change-difficulty" class="btn-leaderboard-bottom btn-diff-change">⚙️ Difficulté</button>
    <button id="btn-show-leaderboard" class="btn-leaderboard-bottom">🏆 Classement</button>
  </div>

  <script type="module" src="scripts/sound.js"></script>
  <script type="module" src="scripts/snakemots.js"></script>
</body>
</html>
