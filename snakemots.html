<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Snake Mots</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text y=%2214%22 font-size=%2216%22>🍃</text></svg>">
  <link rel="stylesheet" href="styles/snakemots.css">
  <link rel="stylesheet" href="styles/leaderboard.css">
</head>
<body>
  <div id="word-display" class="word-target"></div>

  <!-- Top-right HUD -->
  <div id="hud" class="hud-box">
    <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
      <div id="words-counter">Mots : 0/0</div>
      <button id="btn-show-leaderboard" style="padding:2px 8px; font-weight:700; border:1.5px solid #1a1a1a; background:#ffe4b3; border-radius:6px; cursor:pointer;">🏆</button>
    </div>
    <div id="lives-counter" style="margin-top:2px;"></div>
  </div>

  <canvas id="game"></canvas>

  <!-- Countdown overlay -->
  <div id="countdown-overlay" class="hidden">
    <div id="countdown-box">
      <div id="countdown-text"></div>
      <div id="countdown-number"></div>
    </div>
  </div>

  <!-- pop-up game over -->
  <div id="game-over-popup" class="hidden">
    <div id="game-over-content" role="dialog" aria-modal="true">
      <h1 id="final-score">🎉 Bravo ! Super partie ! 🌟</h1>
      <div id="game-summary"></div>
      <div style="margin-top:16px;">
        <button id="popup-restart">Rejouer ! 🚀</button>
      </div>
    </div>
  </div>

  <script type="module" src="scripts/snakemots.js"></script>
</body>
</html>
