<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Snake Mots</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text y=%2214%22 font-size=%2216%22>🍃</text></svg>">
  <link rel="stylesheet" href="styles/snakemots.css">
</head>
<body>

  <div id="word-display" style="
    position:fixed; top:10px; width:100%; text-align:center;
    font-size:2rem; font-weight:bold; color:#003300;
    font-family:monospace; z-index:5;
  "></div>

  <!-- Top-right HUD (words counter + lives) -->
  <div id="hud" style="
    position:fixed; top:10px; right:10px; z-index:6;
    font-family:monospace; text-align:right;
  ">
    <div id="words-counter" style="font-weight:bold; font-size:1rem; color:#003300;">Nombre de mots réussis : 0/0</div>
    <div id="lives-counter" style="font-weight:bold; font-size:1rem; color:#aa0000;">Nombre de vies : 3</div>
  </div>

  <canvas id="game"></canvas>

  <!-- Countdown overlay -->
  <div id="countdown-overlay" style="
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    pointer-events:none; z-index:10; font-family:monospace;
  " class="hidden">
    <div id="countdown-box" style="
      background: rgba(0,0,0,0.6); color: #fff; padding:20px 30px; border-radius:8px; text-align:center;
    ">
      <div id="countdown-text" style="font-size:1.25rem; margin-bottom:8px;"></div>
      <div id="countdown-number" style="font-size:4rem; font-weight:bold;"></div>
    </div>
  </div>

  <!-- pop-up game over (centralisé) -->
  <div id="game-over-popup" class="hidden">
    <div id="game-over-content" role="dialog" aria-modal="true" padding:20px; border-radius:8px; text-align:center; min-width:260px; position:relative;">
      <h1 id="final-score" style="margin:0 0 8px 0;">Score: 0</h1>

      <div id="game-summary" style="margin-top:12px; font-size:0.95rem; color:#333;">
        <!-- Le JS remplit ce bloc avec le récap -->
      </div>

      <div style="margin-top:12px;">
        <button id="popup-restart" style="padding:8px 12px; cursor:pointer;">Rejouer</button>
      </div>

      <div style="margin-top:8px; font-size:0.9rem; color:#444;">
        (Tu peux cliquer sur la petite croix noire pour quitter.)
      </div>
    </div>
  </div>

  <script type="module" src="scripts/snakemots.js"></script>
</body>
</html>
