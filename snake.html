<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Snake</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text y=%2214%22 font-size=%2216%22>🍃</text></svg>">
  <link rel="stylesheet" href="styles/snake.css">
  <link rel="stylesheet" href="styles/leaderboard.css">
</head>
<body>
  <canvas id="game"></canvas>

  <!-- Top-right HUD -->
  <div id="hud" class="hud-badge" style="display:flex; gap:10px; align-items:center;">
    <div id="apple-counter">Pommes : 0 🍎</div>
    <button id="btn-show-leaderboard" style="padding:4px 10px; font-weight:700; border:1.5px solid #1a1a1a; background:#ffe4b3; border-radius:6px; cursor:pointer;">🏆</button>
  </div>

  <!-- pop-up game over -->
  <div id="game-over-popup" class="hidden">
    <div id="game-over-content" role="dialog" aria-modal="true">
      <h1 id="final-score">🎉 Super partie ! Score : 0</h1>
      <div id="game-summary"></div>
      <div style="margin-top:16px;">
        <button id="popup-restart">Rejouer ! 🚀</button>
      </div>
    </div>
  </div>

  <script type="module" src="scripts/snake.js"></script>
</body>
</html>
