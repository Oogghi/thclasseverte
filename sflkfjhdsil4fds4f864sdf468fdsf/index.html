<!DOCTYPE html>
<html lang="fr">
<head>
  <base href="../">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#fbffd8">
  <title>Classe Verte de TH - Space Invaders Mots</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text y=%2214%22 font-size=%2216%22>👾</text></svg>">
  <link rel="stylesheet" href="styles/common.css">
  <link rel="stylesheet" href="styles/polish.css">
  <link rel="stylesheet" href="styles/leaderboard.css">
  <link rel="stylesheet" href="styles/space-invaders-mots.css">
</head>
<body>
  <!-- Titre centré -->
  <div class="header-title-container">
    <h1>Space Invaders Mots</h1>
  </div>

  <!-- Mot cible -->
  <div id="word-display" class="word-target"></div>

  <!-- HUD Top Left (Score) -->
  <div id="score-counter" class="hud-score-box">Score : <strong>0</strong></div>

  <!-- HUD Top Right (Mots & Vies) -->
  <div id="hud" class="hud-box">
    <div id="words-counter">Mots : 0/0</div>
    <div id="lives-counter">♥ ♥ ♥</div>
  </div>

  <!-- Zone de jeu -->
  <main class="game-shell">
    <canvas id="game" aria-label="Jeu Space Invaders Mots"></canvas>
    <div class="controls-hint" aria-hidden="true">
      <span>← → / Q D pour bouger</span><span>Espace pour tirer</span><span>P / Échap pour pause</span>
    </div>
  </main>

  <!-- Contrôles tactiles pour mobile/tablette -->
  <div class="mobile-controls" aria-label="Contrôles tactiles">
    <button id="move-left" type="button" aria-label="Aller à gauche">←</button>
    <button id="shoot" type="button" class="shoot-button" aria-label="Tirer">TIR</button>
    <button id="move-right" type="button" aria-label="Aller à droite">→</button>
  </div>

  <!-- Countdown Overlay (5s Preview) -->
  <div id="countdown-overlay" class="hidden">
    <div id="countdown-box">
      <div id="countdown-text"></div>
      <div id="countdown-number"></div>
    </div>
  </div>

  <!-- Menu Difficulté & Leaderboard Side-by-Side -->
  <div id="difficulty-menu-overlay" class="difficulty-overlay hidden">
    <div class="difficulty-card side-by-side-card" role="dialog" aria-modal="true">
      
      <!-- Colonne Gauche : Sélection de difficulté -->
      <div class="menu-col menu-col-difficulty">
        <div class="difficulty-header">
          <h2>👾 Space Invaders Mots</h2>
          <p class="difficulty-subtitle">Choisis ta difficulté pour commencer :</p>
        </div>

        <div class="difficulty-options">
          <button type="button" class="btn-diff btn-diff-easy" data-diff="0">
            <span class="diff-emoji">🟢</span>
            <div class="diff-info">
              <div class="diff-title">Facile</div>
              <div class="diff-desc">Mot toujours visible à l'écran</div>
            </div>
          </button>

          <button type="button" class="btn-diff btn-diff-medium" data-diff="1">
            <span class="diff-emoji">🟠</span>
            <div class="diff-info">
              <div class="diff-title">Moyen</div>
              <div class="diff-desc">Aperçu 5s puis mot masqué</div>
            </div>
          </button>

          <button type="button" class="btn-diff btn-diff-hard" data-diff="2">
            <span class="diff-emoji">🔴</span>
            <div class="diff-info">
              <div class="diff-title">Difficile</div>
              <div class="diff-desc">Mot mystère complet</div>
            </div>
          </button>
        </div>
      </div>

      <!-- Colonne Droite : Leaderboard preview -->
      <div class="menu-col menu-col-leaderboard">
        <div class="leaderboard-side-header">
          <h3>🏆 Classement</h3>
          <p class="leaderboard-side-subtitle">Top joueurs de la semaine</p>
        </div>
        <div class="leaderboard-side-body">
          <table class="scores-table-side">
            <thead><tr><th style="width:46px;">Rang</th><th>Joueur</th><th style="text-align:right;">Score</th></tr></thead>
            <tbody id="side-scores-body"></tbody>
          </table>
        </div>
        <button type="button" id="btn-open-full-leaderboard" class="btn-side-full-lb">🏆 Voir tout le classement</button>
      </div>

    </div>
  </div>

  <!-- Pause Overlay -->
  <div id="pause-overlay" class="pause-card hidden" role="status">Pause <small>Appuie sur P ou Échap pour reprendre</small></div>

  <!-- Barre d'actions en bas -->
  <div class="bottom-actions">
    <button id="btn-pause" type="button">⏸ Pause</button>
  </div>

  <script type="module" src="scripts/sound.js"></script>
  <script type="module" src="scripts/space-invaders-mots.js"></script>
</body>
</html>
