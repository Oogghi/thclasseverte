<!DOCTYPE html>
<html lang="fr">
<head>
  <base href="../">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Classe Verte de TH - Space Invaders Mots</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text y=%2214%22 font-size=%2216%22>👾</text></svg>">
  <link rel="stylesheet" href="styles/common.css">
  <link rel="stylesheet" href="styles/polish.css">
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      box-sizing: border-box;
      text-align: center;
    }
    .coming-soon-card {
      background: #ffffff;
      padding: 36px 28px;
      border-radius: 18px;
      border: var(--border);
      box-shadow: 6px 6px 0px #1a1a1a;
      max-width: 440px;
      width: 100%;
    }
    .coming-soon-card .emoji {
      font-size: 3.5rem;
      margin-bottom: 12px;
    }
    .coming-soon-card h1 {
      margin: 0 0 12px;
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--text);
    }
    .coming-soon-card p {
      font-size: 1.1rem;
      font-weight: 600;
      color: #333;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .btn-back {
      display: inline-block;
      padding: 12px 24px;
      background: var(--accent-yellow);
      border: var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      font-weight: 800;
      font-size: 1.05rem;
      color: var(--text);
      text-decoration: none;
      transition: transform 0.1s ease, box-shadow 0.1s ease, background 0.15s ease;
    }
    .btn-back:hover {
      background: var(--accent-yellow-hover);
      transform: translate(-1.5px, -1.5px);
      box-shadow: var(--shadow-hover);
    }
  </style>
</head>
<body>
  <div class="coming-soon-card">
    <div class="emoji">👾</div>
    <h1>Space Invaders Mots</h1>
    <p>Ce jeu est en cours de création ! Reviens très bientôt pour défendre la planète avec les mots de la semaine.</p>
    <a href="index.html" class="btn-back">⬅ Retour à l'accueil</a>
  </div>
  <script type="module" src="scripts/sound.js"></script>
</body>
</html>
